<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>robots.txt Generator — UtilsWeb</title>
    <meta name="description" content="Generate a robots.txt — allow/disallow rules per user-agent.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #10B981, #06B6D4);">🤖</div>
                    <div>
                        <h1>robots.txt Generator</h1>
                        <p class="tagline">Generate a robots.txt — allow/disallow rules per user-agent.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                        <div><label>Sitemap URL</label><input type="url" id="sm" value="https://example.com/sitemap.xml"></div>
                        <div><label>Crawl delay (sec, optional)</label><input type="number" id="cd" placeholder="10"></div>
                    </div>
                    <label style="margin-top:10px;">Disallow paths (one per line)</label>
                    <textarea id="dis" rows="6">/admin
/private
/cart</textarea>
                    <label style="margin-top:10px;">Block specific bots (one per line)</label>
                    <textarea id="bots" rows="3">GPTBot
AhrefsBot</textarea>
                    <button class="btn primary" id="runBtn" type="button" style="margin-top:14px;">Generate</button>
                </div>
                <div id="resultBox" class="result-card" style="display:none;flex-direction:column;gap:10px;">
                    <textarea id="out" rows="14" readonly style="font-family:ui-monospace,monospace;font-size:13px;"></textarea>
                    <div style="display:flex;gap:10px;"><a class="btn primary" id="dl" download="robots.txt">⬇ Download</a><button class="btn primary" id="copyBtn">⧉ Copy</button></div>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>Builds a syntactically valid robots.txt. Always upload to the site root.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        $("runBtn").addEventListener("click", () => {
            const sm = $("sm").value.trim();
            const cd = parseFloat($("cd").value);
            const dis = $("dis").value.split("\n").map(s => s.trim()).filter(Boolean);
            const bots = $("bots").value.split("\n").map(s => s.trim()).filter(Boolean);
            const lines = ["# robots.txt — generated by utilsweb.com", "", "User-agent: *"];
            for (const d of dis) lines.push(`Disallow: ${d}`);
            if (cd > 0) lines.push(`Crawl-delay: ${cd}`);
            for (const b of bots) lines.push("", `User-agent: ${b}`, "Disallow: /");
            if (sm) lines.push("", `Sitemap: ${sm}`);
            const out = lines.join("\n");
            $("out").value = out;
            $("dl").href = URL.createObjectURL(new Blob([out], { type: "text/plain" }));
            $("resultBox").style.display = "flex";
        });
        $("copyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText($("out").value);
            $("copyBtn").textContent = "✓ Copied";
            setTimeout(() => $("copyBtn").textContent = "⧉ Copy", 1400);
        });

    })();
    </script>
</body>
</html>
