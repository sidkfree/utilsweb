<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Water Intake Calculator — UtilsWeb</title>
    <meta name="description" content="How much water to drink per day based on weight and activity.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #14B8A6, #06B6D4);">💧</div>
                    <div>
                        <h1>Water Intake Calculator</h1>
                        <p class="tagline">How much water to drink per day based on weight and activity.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                        <div><label>Weight kg</label><input type="number" id="w" value="75" step="0.1"></div>
                        <div><label>Exercise (min/day)</label><input type="number" id="x" value="30"></div>
                    </div>
                </div>
                <div id="resultBox" class="result-card" style="display:block;flex-direction:column;gap:10px;text-align:center;">
                    <div><strong id="l" style="font-size:30px;color:#06B6D4;"></strong> <span style="color:#9aa1b6;">L / day</span></div>
                    <div><strong id="cups" style="color:#9aa1b6;"></strong></div>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>35 ml × kg body weight + ~350 ml per 30 minutes of exercise. Adjust up in heat.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        function calc() {
            const w = parseFloat($("w").value) || 0;
            const x = parseFloat($("x").value) || 0;
            const ml = w * 35 + (x / 30) * 350;
            $("l").textContent = (ml / 1000).toFixed(1);
            $("cups").textContent = Math.round(ml / 240) + " × 8 oz cups";
        }
        ["w","x"].forEach(id => $(id).addEventListener("input", calc));
        calc();

    })();
    </script>
</body>
</html>
