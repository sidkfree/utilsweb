<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CSS Border-Radius Generator — UtilsWeb</title>
    <meta name="description" content="Independent control of each corner — including elliptical curves.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #3B82F6, #06B6D4);">🔘</div>
                    <div>
                        <h1>CSS Border-Radius Generator</h1>
                        <p class="tagline">Independent control of each corner — including elliptical curves.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <div class="row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
                        <div><label>Top-left</label><input type="number" id="tl" value="20" min="0" max="200"></div>
                        <div><label>Top-right</label><input type="number" id="tr" value="20" min="0" max="200"></div>
                        <div><label>Bottom-right</label><input type="number" id="br" value="20" min="0" max="200"></div>
                        <div><label>Bottom-left</label><input type="number" id="bl" value="20" min="0" max="200"></div>
                    </div>
                </div>
                <div id="resultBox" class="result-card" style="display:block;flex-direction:column;gap:14px;align-items:center;">
                    <div id="box" style="width:240px;height:160px;background:linear-gradient(135deg,#3B82F6,#06B6D4);"></div>
                    <div style="display:flex;gap:10px;align-items:stretch;width:100%;"><input type="text" id="css" readonly style="flex:1;font-family:ui-monospace,monospace;"><button class="btn primary" id="copyBtn">⧉ Copy</button></div>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>Four-value border-radius shorthand: top-left, top-right, bottom-right, bottom-left.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        function paint() {
            const v = `${$("tl").value}px ${$("tr").value}px ${$("br").value}px ${$("bl").value}px`;
            $("box").style.borderRadius = v;
            $("css").value = `border-radius: ${v};`;
        }
        ["tl","tr","br","bl"].forEach(id => $(id).addEventListener("input", paint));
        $("copyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText($("css").value);
            $("copyBtn").textContent = "✓ Copied";
            setTimeout(() => $("copyBtn").textContent = "⧉ Copy", 1400);
        });
        paint();

    })();
    </script>
</body>
</html>
