<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CSS Flexbox Generator — UtilsWeb</title>
    <meta name="description" content="Visual Flexbox playground — drag controls, copy the CSS.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #EC4899, #8B5CF6);">📦</div>
                    <div>
                        <h1>CSS Flexbox Generator</h1>
                        <p class="tagline">Visual Flexbox playground — drag controls, copy the CSS.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <div class="row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;">
                        <div><label>flex-direction</label><select id="fd"><option>row</option><option>row-reverse</option><option>column</option><option>column-reverse</option></select></div>
                        <div><label>justify-content</label><select id="jc"><option>flex-start</option><option>center</option><option>flex-end</option><option>space-between</option><option>space-around</option><option>space-evenly</option></select></div>
                        <div><label>align-items</label><select id="ai"><option>stretch</option><option>flex-start</option><option>center</option><option>flex-end</option><option>baseline</option></select></div>
                        <div><label>flex-wrap</label><select id="fw"><option>nowrap</option><option>wrap</option><option>wrap-reverse</option></select></div>
                        <div><label>gap (px)</label><input type="number" id="g" value="12" min="0"></div>
                        <div><label>items</label><input type="number" id="n" value="5" min="1" max="12"></div>
                    </div>
                </div>
                <div id="resultBox" class="result-card" style="display:block;flex-direction:column;gap:14px;">
                    <div id="container" style="border:1px dashed rgba(255,255,255,.15);border-radius:8px;padding:14px;min-height:180px;background:rgba(0,0,0,.2);display:flex;"></div>
                    <div style="display:flex;gap:10px;align-items:stretch;">
                        <textarea id="css" readonly style="flex:1;font-family:ui-monospace,monospace;font-size:12px;" rows="6"></textarea>
                        <button class="btn primary" id="copyBtn">⧉ Copy</button>
                    </div>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>The same CSS in the textarea is applied to the preview container. WYSIWYG, then copy.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        function paint() {
            const c = $("container");
            const props = { display: "flex", flexDirection: $("fd").value, justifyContent: $("jc").value, alignItems: $("ai").value, flexWrap: $("fw").value, gap: $("g").value + "px" };
            Object.assign(c.style, props);
            const n = Math.max(1, Math.min(12, parseInt($("n").value, 10) || 1));
            c.innerHTML = "";
            for (let i = 0; i < n; i++) {
                const it = document.createElement("div");
                it.textContent = i + 1;
                it.style.cssText = "background:linear-gradient(135deg,#06B6D4,#8B5CF6);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;min-width:60px;min-height:60px;border-radius:8px;padding:8px 14px;";
                c.appendChild(it);
            }
            $("css").value = `.container {\n  display: flex;\n  flex-direction: ${$("fd").value};\n  justify-content: ${$("jc").value};\n  align-items: ${$("ai").value};\n  flex-wrap: ${$("fw").value};\n  gap: ${$("g").value}px;\n}`;
        }
        ["fd","jc","ai","fw","g","n"].forEach(id => $(id).addEventListener("input", paint));
        $("copyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText($("css").value);
            $("copyBtn").textContent = "✓ Copied";
            setTimeout(() => $("copyBtn").textContent = "⧉ Copy", 1400);
        });
        paint();

    })();
    </script>
</body>
</html>
