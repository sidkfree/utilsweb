<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>XML Formatter — UtilsWeb</title>
    <meta name="description" content="Pretty-print and validate XML in your browser.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #3B82F6, #8B5CF6);">📰</div>
                    <div>
                        <h1>XML Formatter</h1>
                        <p class="tagline">Pretty-print and validate XML in your browser.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <label>XML</label>
                    <textarea id="inp" rows="12" placeholder="<root><item id='1'>A</item></root>" style="font-family:ui-monospace,monospace;"></textarea>
                    <div class="row" style="display:flex;gap:10px;margin-top:14px;">
                        <button class="btn primary" id="pretty" type="button">Pretty-print</button>
                        <button class="btn primary" id="minify" type="button">Minify</button>
                    </div>
                </div>
                <div id="resultBox" class="result-card" style="display:none;flex-direction:column;gap:10px;">
                    <textarea id="out" rows="14" readonly style="font-family:ui-monospace,monospace;"></textarea>
                    <button class="btn primary" id="copyBtn">⧉ Copy</button>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>

                    <p>Validation uses the browser's native <code>DOMParser</code>. Formatting is a simple regex-based reflow — works on well-formed XML.</p>

                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        function format(xml, indent) {
            // Insert linebreaks around tags
            let formatted = "";
            let pad = 0;
            const reg = /(>)(<)(\/*)/g;
            xml = xml.replace(reg, "$1\n$2$3");
            for (const node of xml.split("\n")) {
                let i = 0;
                if (node.match(/.+<\/\w[^>]*>$/)) i = 0;
                else if (node.match(/^<\//)) { if (pad !== 0) pad -= 1; }
                else if (node.match(/^<[^!?][^>]*[^\/]>.*$/)) i = 1;
                formatted += " ".repeat(pad * indent) + node + "\n";
                pad += i;
            }
            return formatted.trim();
        }
        function validate(s) {
            const doc = new DOMParser().parseFromString(s, "application/xml");
            const err = doc.querySelector("parsererror");
            if (err) throw new Error(err.textContent);
        }
        $("pretty").addEventListener("click", () => {
            clearError();
            try {
                validate($("inp").value);
                $("out").value = format($("inp").value.trim().replace(/>\s+</g, "><"), 2);
                $("resultBox").style.display = "flex";
            } catch (e) { showError(e.message); }
        });
        $("minify").addEventListener("click", () => {
            clearError();
            try {
                validate($("inp").value);
                $("out").value = $("inp").value.replace(/>\s+</g, "><").trim();
                $("resultBox").style.display = "flex";
            } catch (e) { showError(e.message); }
        });
        $("copyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText($("out").value);
            $("copyBtn").textContent = "✓ Copied";
            setTimeout(() => $("copyBtn").textContent = "⧉ Copy", 1400);
        });

    })();
    </script>
</body>
</html>
