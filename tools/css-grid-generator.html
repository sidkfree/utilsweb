<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CSS Grid Generator — UtilsWeb</title>
    <meta name="description" content="Define rows, columns, gaps. Get the grid-template CSS instantly.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #8B5CF6, #3B82F6);">🔲</div>
                    <div>
                        <h1>CSS Grid Generator</h1>
                        <p class="tagline">Define rows, columns, gaps. Get the grid-template CSS instantly.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                        <div><label>grid-template-columns</label><input type="text" id="cols" value="repeat(3, 1fr)" style="font-family:ui-monospace,monospace;"></div>
                        <div><label>grid-template-rows</label><input type="text" id="rows" value="auto" style="font-family:ui-monospace,monospace;"></div>
                        <div><label>gap (px)</label><input type="number" id="gap" value="14"></div>
                        <div><label>cells</label><input type="number" id="n" value="6" min="1" max="36"></div>
                    </div>
                </div>
                <div id="resultBox" class="result-card" style="display:block;flex-direction:column;gap:14px;">
                    <div id="container" style="border:1px dashed rgba(255,255,255,.15);border-radius:8px;padding:14px;background:rgba(0,0,0,.2);"></div>
                    <div style="display:flex;gap:10px;"><textarea id="css" readonly rows="6" style="flex:1;font-family:ui-monospace,monospace;font-size:12px;"></textarea><button class="btn primary" id="copyBtn">⧉ Copy</button></div>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>Type any valid track-list (<code>1fr 2fr</code>, <code>repeat(4, 100px)</code>, <code>minmax(...)</code>). The preview reflects it live.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        function paint() {
            const c = $("container");
            c.style.display = "grid";
            c.style.gridTemplateColumns = $("cols").value;
            c.style.gridTemplateRows    = $("rows").value;
            c.style.gap = $("gap").value + "px";
            const n = Math.max(1, Math.min(36, parseInt($("n").value, 10) || 1));
            c.innerHTML = "";
            for (let i = 0; i < n; i++) {
                const d = document.createElement("div");
                d.textContent = i + 1;
                d.style.cssText = "background:linear-gradient(135deg,#8B5CF6,#3B82F6);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:8px;";
                c.appendChild(d);
            }
            $("css").value = `.container {\n  display: grid;\n  grid-template-columns: ${$("cols").value};\n  grid-template-rows: ${$("rows").value};\n  gap: ${$("gap").value}px;\n}`;
        }
        ["cols","rows","gap","n"].forEach(id => $(id).addEventListener("input", paint));
        $("copyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText($("css").value);
            $("copyBtn").textContent = "✓ Copied";
            setTimeout(() => $("copyBtn").textContent = "⧉ Copy", 1400);
        });
        paint();

    })();
    </script>
</body>
</html>
