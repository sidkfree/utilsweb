<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Markdown → HTML — UtilsWeb</title>
    <meta name="description" content="One-shot Markdown to clean HTML — downloadable.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #14B8A6, #84CC16);">📤</div>
                    <div>
                        <h1>Markdown → HTML</h1>
                        <p class="tagline">One-shot Markdown to clean HTML — downloadable.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <label>Markdown</label>
                    <textarea id="inp" rows="14" placeholder="# Title\n\nSome *Markdown* here."></textarea>
                    <button class="btn primary" id="runBtn" type="button" style="margin-top:14px;">Convert</button>
                </div>
                <div id="resultBox" class="result-card" style="display:none;flex-direction:column;gap:10px;">
                    <textarea id="out" rows="14" readonly style="font-family:ui-monospace,monospace;"></textarea>
                    <div style="display:flex;gap:10px;"><a class="btn primary" id="dl" download="document.html">⬇ Download HTML</a><button class="btn primary" id="copyBtn">⧉ Copy</button></div>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>

                    <p>Pipes Markdown through <a href="https://marked.js.org" target="_blank" rel="noopener">marked</a>, then sanitises the resulting HTML with DOMPurify before showing it.</p>

                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        $("runBtn").addEventListener("click", () => {
            clearError();
            if (typeof marked === "undefined" || typeof DOMPurify === "undefined") return showError("Library still loading...");
            const html = DOMPurify.sanitize(marked.parse($("inp").value));
            $("out").value = html;
            const blob = new Blob([html], { type: "text/html" });
            $("dl").href = URL.createObjectURL(blob);
            $("resultBox").style.display = "flex";
        });
        $("copyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText($("out").value);
            $("copyBtn").textContent = "✓ Copied";
            setTimeout(() => $("copyBtn").textContent = "⧉ Copy", 1400);
        });

    })();
    </script>
</body>
</html>
