<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>URL Slug Generator — UtilsWeb</title>
    <meta name="description" content="Convert any title into a clean, lowercase, hyphenated URL slug.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #14B8A6, #8B5CF6);">🔗</div>
                    <div>
                        <h1>URL Slug Generator</h1>
                        <p class="tagline">Convert any title into a clean, lowercase, hyphenated URL slug.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <label>Text</label>
                    <textarea id="inp" rows="3" placeholder="My Article Title">10 Surprising Things You Can Do With UtilsWeb Today!</textarea>
                    <div class="row" style="display:flex;gap:18px;margin-top:10px;align-items:center;">
                        <div>
                            <label>Separator</label>
                            <select id="sep"><option value="-" selected>hyphen (-)</option><option value="_">underscore (_)</option></select>
                        </div>
                        <label style="display:flex;gap:6px;align-items:center;"><input type="checkbox" id="lc" checked> Lowercase</label>
                        <label style="display:flex;gap:6px;align-items:center;"><input type="checkbox" id="stop"> Strip common stop-words</label>
                    </div>
                </div>
                <div id="resultBox" class="result-card" style="display:block;flex-direction:column;gap:10px;">
                    <input type="text" id="out" readonly style="font-family:ui-monospace,monospace;">
                    <button class="btn primary" id="copyBtn">⧉ Copy</button>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>Strips accents (NFKD), keeps only alphanumerics, joins with hyphens. Optional stop-word filter.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        const STOP = new Set("a an the of and or in on at by for to with from is are be it that this".split(" "));
        function slug() {
            let s = $("inp").value;
            if ($("lc").checked) s = s.toLowerCase();
            s = s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
            let words = s.match(/[a-zA-Z0-9]+/g) || [];
            if ($("stop").checked) words = words.filter(w => !STOP.has(w.toLowerCase()));
            $("out").value = words.join($("sep").value);
        }
        ["inp","sep","lc","stop"].forEach(id => $(id).addEventListener("input", slug));
        $("copyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText($("out").value);
            $("copyBtn").textContent = "✓ Copied";
            setTimeout(() => $("copyBtn").textContent = "⧉ Copy", 1400);
        });
        slug();

    })();
    </script>
</body>
</html>
