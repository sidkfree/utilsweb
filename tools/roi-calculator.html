<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ROI Calculator — UtilsWeb</title>
    <meta name="description" content="Compute Return on Investment, gain, and annualised return.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #8B5CF6, #10B981);">📊</div>
                    <div>
                        <h1>ROI Calculator</h1>
                        <p class="tagline">Compute Return on Investment, gain, and annualised return.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <div class="row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
                        <div><label>Initial investment</label><input type="number" id="i" value="10000"></div>
                        <div><label>Final value</label><input type="number" id="f" value="15000"></div>
                        <div><label>Years held</label><input type="number" id="y" value="3" step="0.1"></div>
                    </div>
                    <button class="btn primary" id="runBtn" type="button" style="margin-top:14px;">Calculate</button>
                </div>
                <div id="resultBox" class="result-card" style="display:none;flex-direction:column;gap:10px;text-align:center;">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;">
                        <div><strong id="g" style="font-size:24px;"></strong><div>Net gain</div></div>
                        <div><strong id="roi" style="font-size:24px;color:#10B981;"></strong><div>ROI %</div></div>
                        <div><strong id="ann" style="font-size:24px;color:#06B6D4;"></strong><div>Annualised %</div></div>
                    </div>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>ROI = (final − initial) / initial. Annualised = (final/initial)^(1/years) − 1.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        $("runBtn").addEventListener("click", () => {
            const i = parseFloat($("i").value), f = parseFloat($("f").value), y = parseFloat($("y").value);
            if (i <= 0) return showError("Initial investment must be > 0.");
            const gain = f - i;
            const roi = (gain / i) * 100;
            const ann = y > 0 ? (Math.pow(f / i, 1 / y) - 1) * 100 : 0;
            $("g").textContent = "$" + gain.toLocaleString();
            $("g").style.color = gain >= 0 ? "#10B981" : "#EF4444";
            $("roi").textContent = roi.toFixed(2) + "%";
            $("ann").textContent = ann.toFixed(2) + "%";
            $("resultBox").style.display = "flex";
        });

    })();
    </script>
</body>
</html>
