<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Aspect Ratio Calculator — UtilsWeb</title>
    <meta name="description" content="Find the missing dimension to keep a 16:9, 4:3 or any custom ratio.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #F59E0B, #F97316);">📐</div>
                    <div>
                        <h1>Aspect Ratio Calculator</h1>
                        <p class="tagline">Find the missing dimension to keep a 16:9, 4:3 or any custom ratio.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <div class="row" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;">
                        <div><label>Ratio W</label><input type="number" id="rw" value="16"></div>
                        <div><label>Ratio H</label><input type="number" id="rh" value="9"></div>
                        <div><label>Width</label><input type="number" id="w" value="1920"></div>
                        <div><label>Height</label><input type="number" id="h"></div>
                    </div>
                    <div class="row" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
                        <button class="btn primary" data-r="16:9">16:9</button>
                        <button class="btn primary" data-r="4:3">4:3</button>
                        <button class="btn primary" data-r="1:1">1:1</button>
                        <button class="btn primary" data-r="9:16">9:16</button>
                        <button class="btn primary" data-r="21:9">21:9</button>
                        <button class="btn primary" data-r="3:2">3:2</button>
                    </div>
                </div>
                <div id="resultBox" class="result-card" style="display:none;"></div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>H = W × (ratio_h / ratio_w). Useful for thumbnails, video exports, banners.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        let inside = false;
        function fromW() {
            if (inside) return;
            const rw = parseFloat($("rw").value), rh = parseFloat($("rh").value), w = parseFloat($("w").value);
            if (rw > 0 && w > 0) { inside = true; $("h").value = Math.round(w * rh / rw); inside = false; }
        }
        function fromH() {
            if (inside) return;
            const rw = parseFloat($("rw").value), rh = parseFloat($("rh").value), h = parseFloat($("h").value);
            if (rh > 0 && h > 0) { inside = true; $("w").value = Math.round(h * rw / rh); inside = false; }
        }
        $("w").addEventListener("input", fromW);
        $("h").addEventListener("input", fromH);
        ["rw","rh"].forEach(id => $(id).addEventListener("input", fromW));
        document.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", (e) => {
            e.preventDefault();
            const [a, c] = b.dataset.r.split(":");
            $("rw").value = a; $("rh").value = c; fromW();
        }));
        fromW();

    })();
    </script>
</body>
</html>
