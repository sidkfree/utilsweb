<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VAT / Sales Tax Calculator — UtilsWeb</title>
    <meta name="description" content="Add or remove VAT / sales tax from any amount.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #F97316, #F59E0B);">🧮</div>
                    <div>
                        <h1>VAT / Sales Tax Calculator</h1>
                        <p class="tagline">Add or remove VAT / sales tax from any amount.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <div class="row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
                        <div><label>Amount</label><input type="number" id="a" value="100" step="0.01"></div>
                        <div><label>VAT %</label><input type="number" id="r" value="20" step="0.01"></div>
                        <div>
                            <label>Direction</label>
                            <select id="d">
                                <option value="add" selected>Add VAT (net → gross)</option>
                                <option value="rem">Remove VAT (gross → net)</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn primary" id="runBtn" type="button" style="margin-top:14px;">Calculate</button>
                </div>
                <div id="resultBox" class="result-card" style="display:none;flex-direction:column;gap:10px;text-align:center;">
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
                        <div><strong id="net" style="font-size:22px;color:#10B981;"></strong><div>Net</div></div>
                        <div><strong id="vat" style="font-size:22px;color:#F59E0B;"></strong><div>VAT</div></div>
                        <div><strong id="gross" style="font-size:22px;color:#06B6D4;"></strong><div>Gross</div></div>
                    </div>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>Add: gross = net · (1+rate). Remove: net = gross / (1+rate). Works for any sales tax / VAT.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        function fmt(n) { return n.toFixed(2); }
        $("runBtn").addEventListener("click", () => {
            const a = parseFloat($("a").value), r = parseFloat($("r").value)/100, d = $("d").value;
            let net, vat, gross;
            if (d === "add") { net = a; vat = a * r; gross = net + vat; }
            else             { gross = a; net = a / (1 + r); vat = gross - net; }
            $("net").textContent = fmt(net);
            $("vat").textContent = fmt(vat);
            $("gross").textContent = fmt(gross);
            $("resultBox").style.display = "flex";
        });

    })();
    </script>
</body>
</html>
