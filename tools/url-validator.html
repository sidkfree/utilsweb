<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>URL Validator — UtilsWeb</title>
    <meta name="description" content="Check if a string is a valid URL — protocol, hostname, port, path.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9522163237779845" crossorigin="anonymous"></script>

</head>
<body>
    <div class="mesh"><div class="blob blob-cyan"></div><div class="blob blob-violet"></div><div class="blob blob-pink"></div><div class="grid-overlay"></div></div>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/"><span class="brand-logo">⚙︎</span><span class="brand-name">UtilsWeb</span></a>
            <nav><a href="/">Tools</a><a href="https://utilsweb.net" class="cta">utilsweb.net</a></nav>
        </div>
    </header>

    <main>
        <section class="tool-page">
            <div class="wrap">
                <a class="back" href="/">← All tools</a>
                <div class="tool-header">
                    <div class="tool-icon big" style="background: linear-gradient(135deg, #8B5CF6, #06B6D4);">🔗</div>
                    <div>
                        <h1>URL Validator</h1>
                        <p class="tagline">Check if a string is a valid URL — protocol, hostname, port, path.</p>
                    </div>
                </div>


                <div class="tool-form">
                    <label>URLs (one per line)</label>
                    <textarea id="inp" rows="8" placeholder="https://example.com">https://utilsweb.com/tools
http://localhost:3000/api?q=1
not a url
ftp://files.example.org/path</textarea>
                </div>
                <div id="resultBox" class="result-card" style="display:block;">
                    <table style="width:100%;font-size:13px;"><tbody id="rows"></tbody></table>
                </div>


                <div id="errorBox" class="error-card" style="display:none;"></div>

                <section class="tool-desc">
                    <h3>How it works</h3>
<p>Uses the browser's native <code>URL</code> constructor — the same one the platform uses internally.</p>
                </section>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap"><p>🔒 100% client-side — nothing ever leaves your browser.</p></div>
    </footer>

    <script>
    (function () {
        const $ = (id) => document.getElementById(id);
        function showError(msg) {
            const eb = $("errorBox");
            eb.textContent = "⚠ " + msg;
            eb.style.display = "block";
        }
        function clearError() { const eb = $("errorBox"); eb.style.display = "none"; eb.textContent = ""; }

        function check() {
            const lines = $("inp").value.split("\n").map(s => s.trim()).filter(Boolean);
            $("rows").innerHTML = lines.map(u => {
                try {
                    const x = new URL(u);
                    return `<tr><td style='padding:6px;font-family:ui-monospace,monospace;'>${u}</td><td style='text-align:right;padding:6px;color:#10B981;'>✓ ${x.protocol}//${x.host}</td></tr>`;
                } catch {
                    return `<tr><td style='padding:6px;font-family:ui-monospace,monospace;'>${u}</td><td style='text-align:right;padding:6px;color:#EF4444;'>✗ Invalid</td></tr>`;
                }
            }).join("");
        }
        $("inp").addEventListener("input", check);
        check();

    })();
    </script>
</body>
</html>
